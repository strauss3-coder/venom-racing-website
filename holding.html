/* ---------------------------------------------------------------------
   Venom Racing — holding page

   Single-theme on purpose: this is the brand's own cinematic dark world,
   not a document that should follow the reader's light preference. Every
   colour is therefore painted explicitly rather than inherited.

   Palette and texture are the site's own, from assets/css/variables.css
   and the .texture-carbon rule in styles.css, so this reads as the same
   brand as the page it stands in for.
   --------------------------------------------------------------------- */
:root {
  --void:        #08080a;
  --carbon:      #0a0a0b;
  --carbon-alt:  #101012;
  --red:         #b3121f;
  --red-bright:  #e33140;
  --red-glow:    rgba(224, 30, 46, 0.45);
  --text-muted:  #d4d4d8;
  --hairline:    rgba(255, 255, 255, 0.10);

  --font-display: 'Bebas Neue', 'Oswald', sans-serif;
  --font-heading: 'Barlow Condensed', 'Oswald', system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;               /* full-screen only, never scrolls */
  background: var(--void);
  color: var(--text-muted);
  font-family: var(--font-heading);
  -webkit-font-smoothing: antialiased;
}

.stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  isolation: isolate;
}

/* --- ground: carbon weave, exactly the site's own texture ------------- */
.weave {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-color: var(--carbon);
  background-image:
    repeating-linear-gradient(45deg,  rgba(255,255,255,.015) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.015) 0 1px, transparent 1px 6px);
}

/* --- ambient light: three slow blooms standing in for smoke ----------
   Heavily blurred elements are cheap for the compositor, where real
   canvas smoke is not. Only transform and opacity animate.            */
.bloom {
  position: absolute;
  z-index: 1;
  border-radius: 50%;
  filter: blur(90px);
  will-change: transform, opacity;
  pointer-events: none;
}
.bloom--warm {
  width: 62vmax; height: 62vmax;
  left: 50%; top: 52%;
  margin: -31vmax 0 0 -31vmax;
  background: radial-gradient(circle, rgba(179,18,31,.30) 0%, rgba(179,18,31,.10) 42%, transparent 70%);
  animation: drift-a 34s ease-in-out infinite;
}
.bloom--cool {
  width: 46vmax; height: 46vmax;
  left: 18%; top: 22%;
  margin: -23vmax 0 0 -23vmax;
  background: radial-gradient(circle, rgba(90,96,120,.16) 0%, transparent 68%);
  animation: drift-b 46s ease-in-out infinite;
}
.bloom--ember {
  width: 40vmax; height: 40vmax;
  left: 82%; top: 78%;
  margin: -20vmax 0 0 -20vmax;
  background: radial-gradient(circle, rgba(227,49,64,.16) 0%, transparent 66%);
  animation: drift-c 40s ease-in-out infinite;
}

@keyframes drift-a {
  0%,100% { transform: translate3d(0,0,0)        scale(1);    opacity: .85; }
  50%     { transform: translate3d(3vw,-2vh,0)   scale(1.10); opacity: 1;   }
}
@keyframes drift-b {
  0%,100% { transform: translate3d(0,0,0)        scale(1);    opacity: .55; }
  50%     { transform: translate3d(5vw,4vh,0)    scale(1.14); opacity: .80; }
}
@keyframes drift-c {
  0%,100% { transform: translate3d(0,0,0)        scale(1.06); opacity: .60; }
  50%     { transform: translate3d(-4vw,-3vh,0)  scale(1);    opacity: .90; }
}

/* --- a single slow light streak, like a shop light passing ------------ */
.streak {
  position: absolute;
  z-index: 2;
  top: -30%;
  left: -40%;
  width: 45%;
  height: 160%;
  transform: rotate(14deg);
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255,255,255,.020) 45%,
    rgba(255,255,255,.035) 50%,
    rgba(255,255,255,.020) 55%,
    transparent 100%);
  filter: blur(22px);
  animation: sweep 26s linear infinite;
  pointer-events: none;
}
@keyframes sweep {
  0%   { transform: translate3d(0,0,0) rotate(14deg);     opacity: 0; }
  12%  { opacity: 1; }
  88%  { opacity: 1; }
  100% { transform: translate3d(240vw,0,0) rotate(14deg); opacity: 0; }
}

/* --- drifting motes ---------------------------------------------------- */
/* width/height are explicit because a canvas is a replaced element:
   with them auto, inset:0 resolves to its intrinsic 300x150 rather
   than stretching, which pens the motes into the middle. */
#motes {
  position: absolute; inset: 0; z-index: 3;
  width: 100%; height: 100%;
  pointer-events: none;
}

/* --- vignette, closing the frame --------------------------------------- */
.vignette {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 45%, transparent 30%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.88) 100%);
}

/* --- the centre -------------------------------------------------------- */
.core {
  position: relative;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(26px, 5vh, 46px);
  padding: 24px;
  text-align: center;
}

.mark {
  position: relative;
  display: block;
  width: min(74vw, 400px);
  animation: breathe 7s ease-in-out infinite;
  will-change: transform, opacity;
}
/* The glow sits behind the artwork rather than on it, so the logo's own
   black keyline stays crisp instead of blooming. */
.mark::before {
  content: "";
  position: absolute;
  left: 50%; top: 52%;
  width: 118%; height: 210%;
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at center,
    var(--red-glow) 0%, rgba(224,30,46,.20) 38%, transparent 68%);
  filter: blur(34px);
  z-index: -1;
  animation: halo 7s ease-in-out infinite;
}
.mark img {
  display: block;
  width: 100%;
  height: auto;
}

@keyframes breathe {
  0%,100% { transform: scale(1);     opacity: .94; }
  50%     { transform: scale(1.022); opacity: 1;   }
}
@keyframes halo {
  0%,100% { opacity: .58; transform: translate(-50%,-50%) scale(1);    }
  50%     { opacity: .95; transform: translate(-50%,-50%) scale(1.07); }
}

.line {
  margin: 0;
  font-family: var(--font-heading);
  font-weight: 500;
  font-size: clamp(13px, 1.6vw + 8px, 19px);
  letter-spacing: .34em;
  text-indent: .34em;              /* balances the trailing letter-space */
  text-transform: uppercase;
  color: var(--text-muted);
  opacity: .82;
}

/* --- the working indicator --------------------------------------------
   A gauge sweep rather than a generic spinner: the brand's own mark
   carries a tachometer, so the loader borrows its language.            */
.status {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(16px, 2.4vh, 24px);
}

.tach { width: 30px; height: 30px; display: block; }
.tach__ring   { fill: none; stroke: var(--hairline); stroke-width: 1.5; }
.tach__ticks  { stroke: rgba(255,255,255,.20); stroke-width: 1.4; stroke-linecap: round; }
.tach__needle {
  fill: none;
  stroke: var(--red-bright);
  stroke-width: 2.2;
  stroke-linecap: round;
  transform-origin: 50% 50%;
  animation: rev 2.4s cubic-bezier(.5,0,.5,1) infinite;
}
@keyframes rev { to { transform: rotate(360deg); } }

.bar {
  position: relative;
  width: min(62vw, 280px);
  height: 2px;
  border-radius: 2px;
  background: rgba(255,255,255,.10);
  overflow: hidden;
}
.bar::after {                       /* the travelling pull */
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 42%;
  border-radius: 2px;
  background: linear-gradient(90deg,
    transparent 0%,
    var(--red) 30%,
    var(--red-bright) 88%,
    #ff6b76 100%);
  box-shadow: 0 0 12px 1px rgba(227,49,64,.55);
  animation: pull 2.4s cubic-bezier(.65,0,.35,1) infinite;
  will-change: transform;
}
@keyframes pull {
  0%   { transform: translateX(-105%); }
  100% { transform: translateX(340%);  }
}

/* --- shorter viewports ------------------------------------------------- */
@media (max-height: 520px) {
  .core { gap: clamp(16px, 3.5vh, 26px); }
  .mark { width: min(52vw, 280px); }
}

/* --- stillness for anyone who asks for it ------------------------------ */
@media (prefers-reduced-motion: reduce) {
  .bloom, .streak, .mark, .mark::before, .tach__needle, .bar::after {
    animation: none !important;
  }
  .streak  { opacity: .5; }
  .mark    { opacity: 1; }
  .mark::before { opacity: .75; }
  .bar::after   { transform: translateX(0); width: 46%; }
}
</style>

<script>
/* Fine motes drifting through the light. One canvas, a small fixed
   population, and no work at all when the visitor asks for stillness or
   the tab is in the background. */
(function () {
  'use strict';
  var canvas = document.getElementById('motes');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var motes = [];
  var w = 0, h = 0, dpr = 1, raf = null;

  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth;
    h = canvas.clientHeight;
    canvas.width  = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function build() {
    // Scaled to the viewport so a phone does not carry a desktop's load.
    var n = Math.round(Math.min(70, Math.max(24, (w * h) / 26000)));
    motes = [];
    for (var i = 0; i < n; i++) {
      motes.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.5 + 0.4,
        vy: -(Math.random() * 0.16 + 0.04),        // a slow rise
        sway: Math.random() * 0.28 + 0.06,
        phase: Math.random() * Math.PI * 2,
        a: Math.random() * 0.30 + 0.06,
        warm: Math.random() < 0.22                 // a few catch the red
      });
    }
  }

  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      m.y += m.vy;
      m.phase += 0.004;
      var x = m.x + Math.sin(m.phase) * (m.sway * 18);
      if (m.y < -6) { m.y = h + 6; m.x = Math.random() * w; }
      ctx.beginPath();
      ctx.arc(x, m.y, m.r, 0, Math.PI * 2);
      ctx.fillStyle = m.warm
        ? 'rgba(227,49,64,' + m.a.toFixed(3) + ')'
        : 'rgba(228,228,231,' + (m.a * 0.7).toFixed(3) + ')';
      ctx.fill();
    }
    raf = window.requestAnimationFrame(draw);
  }

  function start() { if (raf === null && !still) raf = window.requestAnimationFrame(draw); }
  function stop()  { if (raf !== null) { window.cancelAnimationFrame(raf); raf = null; } }

  function reset() { size(); build(); if (still) { ctx.clearRect(0,0,w,h); draw._once = true; drawOnce(); } }

  function drawOnce() {
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fillStyle = m.warm
        ? 'rgba(227,49,64,' + m.a.toFixed(3) + ')'
        : 'rgba(228,228,231,' + (m.a * 0.7).toFixed(3) + ')';
      ctx.fill();
    }
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(reset, 150);
  });

  // Nothing should animate behind a hidden tab.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else start();
  });

  size();
  build();
  if (still) drawOnce(); else start();
})();
</script>
